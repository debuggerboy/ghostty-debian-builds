name: Build Ghostty Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GHOSTTY_REPO: "ghostty-org/ghostty"
  GHOSTTY_VERSION: "v1.4.0"
  ARCH: "amd64"
  RELEASE_TAG: "main"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.distro }} Package
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            version: "26.04"
          - distro: debian
            version: "13"
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: Checkout Ghostty Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GHOSTTY_REPO }}
          ref: ${{ env.GHOSTTY_VERSION }}
          path: ghostty

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential wget curl xz-utils gettext libgtk-4-dev libgtk4-layer-shell-dev libadwaita-1-dev libxml2-utils blueprint-compiler libx11-dev git bzip2 meson ninja-build python3-pip libgirepository1.0-dev

      - name: Build and Install blueprint-compiler 0.20.4
        run: |
          cd /tmp
          # Download from GNOME official source, filename uses underscore
          wget https://download.gnome.org/sources/blueprint-compiler/0.20/blueprint-compiler-0.20.4.tar.xz
          tar -xf blueprint-compiler-0.20.4.tar.xz
          cd blueprint-compiler-0.20.4
          meson setup _build
          ninja -C _build
          ninja -C _build install
          blueprint-compiler --version

      - name: Setup Zig
        uses: debuggerboy/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build Ghostty binary
        run: |
          cd ghostty
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          zig build --fetch
          zig build -Doptimize=ReleaseFast -Dcpu=baseline
          mv zig-out ghostty
          tar -jcf ghostty-${{ matrix.distro }}-${{ matrix.version }}-${{ env.ARCH }}.tar.bz2 ghostty

      - name: List files
        run: ls -liFh ghostty

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          working_directory: ghostty
          files: ghostty-${{ matrix.distro }}-${{ matrix.version }}-${{ env.ARCH }}.tar.bz2
